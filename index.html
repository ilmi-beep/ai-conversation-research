<!--
=====================================================================
HOW TO USE THIS TEMPLATE
=====================================================================
1. All content lives in the <script id="report-data"> block as JSON.
   Edit the text and numbers there. The layout and styling never change.
2. To save as PDF: browser Print, Save as PDF, turn on "Background graphics".
3. If the page shows a red "data error" box, the JSON has a typo
   (usually a missing comma or quote). The message says where.

BLOCK TYPES (each block has "type" plus these fields)
  text         title, paragraphs: ["...", "..."]
  bullets      title, items: ["...", "..."]
  scorecards   items: [{value, label, sub, tone}]      tone = good | warn | (empty)
  proof        title, caption, items: [{value, label}] dark strip, 4 items work best
  table        title, caption, searchable (true/false), search_placeholder,
               columns: [{key, label, kind}]           kind = text | num | sev | chip | mono
               rows: [{ key: value, ... }]             sev values: High, Medium, Low, OK,
                                                       Available, Observed, Partial,
                                                       Differently defined, Not available, Unconfirmed
  code         label, code                             dark code block
  compare      left / right: {label, tone, code, note} two code blocks side by side
  bars         title, caption, max, value_width, items: [{label, value, display, tone}]
  composition  title, caption, items: [{label, value, display, color}]
  stacked      title, caption, normalize, legend: [{label, color}],
               rows: [{label, segments: [n, n, ...], display}]   (added in this version)
  cards        title, columns (1-4), items: [{tag, title, text}]
  note         label, text                             lime-edged note
  callout      title, text                             dark panel
  skyband      title, text                             blue panel
  phases       items: [{label, title, text, effort}]   roadmap rows

INLINE FORMATTING inside any text: **bold**   `code`   ==lime highlight==   [link text](https://example.com)
=====================================================================
-->
<style>
:root{
  --bg:#EEEADE; --surface:#F6F4EC; --ink:#2A2B29; --ny:#E1FF01; --bl:#B8D3D8; --tp:#BFC0B6; --wh:#FFFFFF;
  --line:#D9D4C5; --muted:#6E6E66; --ink-soft:#55564F; --ink-mute:#7A7B72; --refdom:#5E8C97; --good:#5E7D4F;
  --warn:#C24E1E;
  --serif:"TT Lakes Neue","Roboto",system-ui,sans-serif;
  --head:"TT Lakes Neue Head","TT Lakes Neue",Roboto,sans-serif;
  --sans:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme: light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
[id]{scroll-margin-top:64px}

.container{max-width:1140px;margin:0 auto;padding:0 30px}
@media (max-width:820px){.container{padding:0 18px}}

/* ---- brand head ---- */
.brandhead{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0}
.brandhead .logo{height:32px;width:auto;display:block}
.brandhead .brandtag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.5}
@media (max-width:560px){.brandhead{flex-direction:column;align-items:flex-start;gap:10px}.brandhead .brandtag{text-align:left}}

/* ---- sticky chip nav ---- */
.navchips{position:sticky;top:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);border-bottom:1.5px solid var(--line);padding:12px 0}
.navchips .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.navchips .row::-webkit-scrollbar{display:none}
.navchip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:6px 13px;background:var(--bg);white-space:nowrap;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.navchip:hover{color:var(--ink);border-color:var(--ink)}
.navchip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---- type ---- */
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::before{content:"";width:26px;height:3px;background:var(--ink);display:inline-block;flex-shrink:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0 0 16px;max-width:24ch;text-wrap:balance}
h1 em{font-style:italic;font-weight:400}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.8vw,32px);letter-spacing:-.012em;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 6px}
h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
p{margin:0 0 14px;max-width:74ch}
a{color:var(--ink)}
.lead{font-size:17px;color:var(--ink-soft);max-width:70ch}
.u-lm{background:linear-gradient(transparent 62%,var(--ny) 62%);padding:0 .05em}
.u-bl{background:linear-gradient(transparent 62%,var(--bl) 62%);padding:0 .05em}

/* ---- pills, tags ---- */
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:3px 9px;margin:0 6px 6px 0}
.classchip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--ny);color:var(--ink);padding:3px 9px;border-radius:100px;font-weight:600;display:inline-block}

/* ---- layout ---- */
.hero{padding:34px 0 34px;border-bottom:1.5px solid var(--line)}
section.section{padding:48px 0;border-bottom:1.5px solid var(--line)}
section.section:last-of-type{border-bottom:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.responsive-grid{display:grid}
@media (max-width:880px){.responsive-grid{grid-template-columns:1fr !important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}

/* ---- score cards ---- */
.scorecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px}
.score .v{font-family:var(--head);font-weight:600;font-size:clamp(24px,3vw,30px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score .v.warn{color:var(--warn)}
.score .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.score .sub{font-size:12px;color:var(--ink-soft);margin-top:4px}

/* ---- lists ---- */
ul.clean{list-style:none;max-width:74ch;margin:0;padding-left:0}
ul.clean li{position:relative;padding-left:22px;margin-bottom:9px}
ul.clean li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;background:var(--ny);border:1.5px solid var(--ink);border-radius:2px}

/* ---- panels ---- */
.skyband{background:var(--bl);border-radius:20px;padding:36px}
.skyband h2{max-width:24ch;margin-bottom:12px}
.skyband .lead{color:#36474a;max-width:62ch}
.callout{background:var(--ink);color:#f3f0e6;border-radius:16px;padding:26px 28px}
.callout h2,.callout h3{color:#fff}
.callout .lead{color:#cfcabb}
.callout .lime{color:var(--ny)}
.callout p{color:#cfcabb}
.callout code{color:#e6e3d8}

/* ---- proof strip (dark, 4 col stat band) ---- */
.proof{background:var(--ink);border-radius:16px;padding:22px 26px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.proof .pi{border-left:2px solid var(--ny);padding-left:14px}
.proof .pv{font-family:var(--head);font-weight:600;font-size:21px;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
.proof .pk{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#a8a89e;margin-top:5px}
@media (max-width:880px){.proof{grid-template-columns:1fr 1fr}}

/* ---- tables ---- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{background:var(--bl);color:var(--ink);text-align:left;padding:10px 14px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);font-weight:600}
th:first-child{border-radius:14px 0 0 14px} th:last-child{border-radius:0 14px 14px 0}
td{padding:11px 14px;border-bottom:1px solid rgba(42,43,41,.09);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- horizontal bar rows (inline graphs, no chart library) ---- */
.hb-row{display:grid;grid-template-columns:1fr 100px 46px;align-items:center;gap:12px;padding:7px 0}
.hb-label{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:13px;background:rgba(184,211,216,.42);border-radius:8px;overflow:hidden}
.hb-fill{height:100%;background:var(--ink);border-radius:0 6px 6px 0}
.hb-fill.warn{background:var(--warn)}
.hb-val{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* ---- composition bar (part to whole) ---- */
.comp-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.comp-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.comp-legend-item{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.comp-swatch{width:11px;height:11px;border-radius:2px;flex:none}

.note{border-left:4px solid var(--ny);background:rgba(255,255,255,.5);border-radius:0 18px 18px 0;padding:14px 18px;font-size:13.5px;color:var(--ink-soft)}

footer.sitefoot{padding:28px 0;color:var(--muted);font-size:12.5px;border-top:1.5px solid var(--line)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

@page{size:A4;margin:16mm 14mm}
@media print{
  body{background:#EEEADE;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .navchips{position:static}
  .card,.score,.skyband,.callout,.proof,.note,.hb-row,tr{break-inside:avoid}
  h2,h3,h4{break-after:avoid}
  a{color:inherit;text-decoration:none}
}

/* ---- v2 additions ---- */
.score .v.good{color:var(--good)}
code{font-family:var(--mono);font-size:.92em;background:rgba(42,43,41,.06);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* ---- template additions ---- */
.samplebar{position:sticky;top:0;z-index:100;background:var(--warn);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:8px 14px}
body.has-sample .navchips{top:33px}
.block{margin-top:26px}
h3.bt{margin:0 0 12px}
.caption{font-size:12.5px;color:var(--muted);margin:10px 0 0;max-width:none}
.sev{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:100px;font-weight:600;white-space:nowrap}
.sev.high,.sev.critical{background:var(--warn);color:#fff}
.sev.medium{background:var(--ny);color:var(--ink)}
.sev.low{background:var(--tp);color:var(--ink)}
.sev.ok{background:var(--good);color:#fff}
pre.code{margin:0 0 6px;background:var(--ink);color:#e6e3d8;border-radius:12px;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre}
.hb-wide .hb-row{grid-template-columns:minmax(120px,280px) 1fr 80px}
.phase{display:grid;grid-template-columns:160px 1fr;gap:20px;padding:22px 0;border-top:1.5px solid var(--line)}
.phase:first-child{border-top:none;padding-top:6px}
.phase .pn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.phase p{margin-bottom:6px}
.phase .effort{font-size:13px;color:var(--ink-soft)}
@media (max-width:700px){.phase{grid-template-columns:1fr;gap:6px}}
.search{display:block;margin:0 0 12px;padding:10px 14px;width:100%;max-width:420px;border:1px solid var(--line);border-radius:100px;font-family:var(--mono);font-size:13px;background:var(--surface);color:var(--ink)}
.data-error{max-width:720px;margin:60px auto;padding:22px;border:2px solid var(--warn);border-radius:12px;background:#fff;font-family:var(--mono);font-size:13px;line-height:1.6}
.callout .lime,.proof .lime{color:var(--ny)}
.callout h3{font-size:22px;margin-bottom:10px}
.card h3{margin-top:2px}

/* ---- research-report additions (same tokens, no new colours) ---- */
.sev.available,.sev.observed{background:var(--good);color:#fff}
.sev.partial{background:var(--ny);color:var(--ink)}
.sev.differentlydefined{background:var(--bl);color:var(--ink)}
.sev.notavailable{background:var(--warn);color:#fff}
.sev.unconfirmed{background:var(--tp);color:var(--ink)}
.st-fill{display:flex;height:100%;border-radius:0 6px 6px 0;overflow:hidden}
.st-fill > div{height:100%}
.comp-legend.tight{margin-top:4px;margin-bottom:12px}
.proof-wrap .caption{margin-top:12px}
@media (max-width:560px){.hb-wide .hb-row{grid-template-columns:1fr 90px !important}.hb-wide .hb-row .hb-track{grid-column:1 / -1;grid-row:2}.hb-wide .hb-row .hb-label{white-space:normal}}
</style>
</head>

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // Inline formatting. Everything is escaped first, so HTML in the data is shown as text.
  function fmt(s, dark) {

  function renderBlock(b) {

  }

  function showError(msg) {
    document.getElementById('app').innerHTML = '<div class="data-error"><strong>Data error</strong><br>' + esc(msg) + '</div>';
  }

  var D;
  try {
    D = JSON.parse(document.getElementById('report-data').textContent);
  } catch (e) {
    showError('The data block is not valid JSON: ' + e.message + '. Check for a missing comma, quote or bracket near the position mentioned.');
    return;
  }

  try {
    var meta = D.meta || {};
    var sections = D.sections || [];
    document.title = meta.title || 'Audit Report';
    if (meta.sample_data) document.body.classList.add('has-sample');

    var navItems = sections.map(function (s, i) { return { id: s.id || ('section-' + i), nav: s.nav }; }).filter(function (x) { return x.nav; });
    var html = '';
    if (meta.sample_data) html += '<div class="samplebar">Sample data. Replace the report-data block, then set sample_data to false.</div>';
    html += '<div class="container"><div class="brandhead">' +
      (meta.show_logo === false ? '<span></span>' : '<span aria-label="Logo">' + LOGO + '</span>') +
      '<div class="brandtag">' + esc(meta.brand_tag || '') + (meta.brand_date ? '<br>' + esc(meta.brand_date) : '') + '</div></div></div>';
    if (navItems.length) {
      html += '<nav class="navchips" aria-label="Section navigation"><div class="container row">' +
        navItems.map(function (n) { return '<button class="navchip" data-target="' + esc(n.id) + '">' + esc(n.nav) + '</button>'; }).join('') +
        '</div></nav>';
    }
    html += sections.map(renderSection).join('');
    if (meta.footer) html += '<footer class="sitefoot"><div class="container">' + fmt(meta.footer) + '</div></footer>';
    document.getElementById('app').innerHTML = html;
  } catch (e) {
    showError('The data is valid JSON but a block is malformed: ' + e.message);
    return;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-target]');
    if (!t) return;
    var el = document.getElementById(t.getAttribute('data-target'));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.matches || !t.matches('[data-search]')) return;
    var q = t.value.toLowerCase();
    var wrap = t.nextElementSibling;
    if (!wrap) return;
    wrap.querySelectorAll('tbody tr').forEach(function (tr) { tr.style.display = tr.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none'; });
  });
})();
</script>
</body>
</html>
